<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Chim Bay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #1b2a49;
            --gold: #ffcd3c;
            --gold-dark: #b3811a;
            --panel: #233a6b;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            height: 100%;
            background: #10182b;
            font-family: "VT323", "Courier New", monospace;
            font-size: 20px;
            overflow: hidden;
            touch-action: manipulation;
        }

        button,
        input {
            font-family: inherit;
        }

        #wrap {
            position: relative;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #stage {
            position: relative;
            height: 100vh;
            max-height: 100%;
            aspect-ratio: 360 / 640;
            max-width: 100vw;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            background: #8e86d8;
        }

        #overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 18px;
            background: rgba(14, 20, 48, .78);
            color: #fff;
            text-align: center;
        }

        #overlay.hidden {
            display: none;
        }

        h1 {
            margin: 0 0 4px;
            font-size: 64px;
            line-height: 1;
            letter-spacing: 2px;
            font-weight: 400;
            color: #ff4b4b;
            text-shadow: 3px 3px 0 var(--ink), -1px -1px 0 var(--ink), 1px -1px 0 var(--ink), -1px 1px 0 var(--ink);
        }

        #deathMeme {
            display: block;
            max-width: 220px;
            max-height: 110px;
            margin-bottom: 4px;
            object-fit: contain;
        }

        #deathMemeWrap {
            display: none;
            position: relative;
            max-width: 220px;
            max-height: 110px;
        }

        #deathMemeWrap img {
            display: block;
            max-width: 220px;
            max-height: 110px;
            object-fit: contain;
        }

        #deathMemeText {
            position: absolute;
            left: 50%;
            bottom: 5px;
            transform: translateX(-50%);
            color: #fff;
            font-size: 30px;
            font-weight: 900;
            line-height: 1;
            white-space: nowrap;
            text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
        }

        #highScoreImage {
            display: none;
            max-width: 220px;
            max-height: 140px;
            margin-bottom: 4px;
            object-fit: contain;
        }

        #sub {
            margin: 0 0 12px;
            opacity: .9;
            font-size: 22px;
        }

        #nameRow {
            position: absolute;
            z-index: 2;
            top: 10px;
            left: 10px;
            display: flex;
            align-items: center;
            max-width: calc(100% - 20px);
        }

        #nameRow[hidden] {
            display: none;
        }

        #nameDisplay {
            color: #ffd45c;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 2px 2px 0 var(--ink);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #nameEditBtn {
            flex: 0 0 auto;
            padding: 0;
            margin-left: 2ch;
            font-size: 22px;
            border: 0;
            background: transparent;
            color: #fff;
            box-shadow: none;
        }

        #birdPreview {
            display: none;
            width: 44px;
            height: 44px;
            border: 3px solid var(--ink);
            border-radius: 50%;
            object-fit: cover;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 8px 10px;
            border: 3px solid var(--ink);
            border-radius: 0;
            background: #fff;
            color: var(--ink);
            font-size: 26px;
            text-align: center;
            outline: none;
        }

        input:focus {
            border-color: var(--gold);
        }

        #name {
            flex: 0 1 14ch;
            width: 14ch;
            min-width: 8ch;
            background: transparent;
            color: #ffd45c;
            border: 0;
            box-shadow: none;
            padding: 2px 8px 6px;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 1px;
            text-align: left;
            text-shadow: 2px 2px 0 var(--ink);
        }

        #name[hidden],
        #nameDisplay[hidden],
        #nameEditBtn[hidden] {
            display: none;
        }

        #name::placeholder {
            color: rgba(255, 255, 255, .7);
            font-weight: 400;
            text-shadow: none;
        }

        input[type="range"] {
            flex: 1;
            padding: 0;
            height: 24px;
            border: 0;
            background: transparent;
            accent-color: var(--gold);
        }

        button {
            padding: 8px 18px;
            border: 3px solid var(--ink);
            border-radius: 0;
            font-size: 26px;
            line-height: 1.1;
            background: var(--gold);
            color: var(--ink);
            box-shadow: 0 4px 0 var(--gold-dark);
            cursor: pointer;
        }

        button:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 var(--gold-dark);
        }

        #playBtn {
            margin-top: 12px;
            width: 100%;
            max-width: 280px;
            font-size: 32px;
            padding: 10px;
        }

        #board {
            margin-top: 16px;
            width: 100%;
            max-width: 280px;
            background: var(--panel);
            border: 3px solid var(--ink);
            box-shadow: 4px 4px 0 var(--ink);
            padding: 8px 10px;
        }

        #board h2 {
            margin: 0 0 4px;
            font-size: 24px;
            font-weight: 400;
            letter-spacing: 1px;
            color: #ffd45c;
        }

        #board ol {
            list-style: none;
            margin: 0;
            padding: 0;
            max-height: 230px;
            overflow: auto;
            text-align: left;
            font-size: 22px;
            scrollbar-width: none;
        }

        #board ol::-webkit-scrollbar,
        #settingsPanel::-webkit-scrollbar {
            display: none;
        }

        #board li {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 3px 2px;
            border-bottom: 2px dashed rgba(255, 255, 255, .14);
        }

        #board li .avatar {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 26px;
            width: 26px;
            height: 26px;
            border: 2px solid var(--ink);
            background: rgba(255, 205, 60, .3);
            color: #ffd45c;
            font-size: 18px;
            object-fit: cover;
        }

        #board li .rk {
            width: 24px;
            opacity: .7;
        }

        #board li .nm {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #board li .sc {
            color: #fff;
        }

        #board li.me {
            color: #ffd45c;
        }

        #status {
            font-size: 16px;
            opacity: .75;
            margin-top: 4px;
            min-height: 16px;
        }

        #result {
            width: 100%;
            max-width: 280px;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .scoreRow {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 2px 8px;
            border-bottom: 2px dashed rgba(255, 255, 255, .25);
        }

        #result b {
            font-size: 48px;
            line-height: 1;
            font-weight: 400;
            color: #ffd45c;
            text-shadow: 3px 3px 0 var(--ink);
        }

        /* ----------------------- Cài đặt ----------------------- */
        #giftLinkBtn {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 44px;
            height: 44px;
            padding: 0;
            font-size: 22px;
            background: var(--panel);
            color: #fff;
            box-shadow: 0 4px 0 var(--ink);
            animation: gift-wiggle 2s ease-in-out infinite;
            transform-origin: 50% 15%;
        }

        #giftLinkBtn:disabled {
            animation: none;
        }

        #giftMediaModal {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            background: rgba(0, 0, 0, .94);
        }

        #giftMediaModal[hidden] {
            display: none;
        }

        #giftMediaModal video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #closeGiftMedia {
            position: absolute;
            top: calc(env(safe-area-inset-top, 0px) + 12px);
            right: calc(env(safe-area-inset-right, 0px) + 12px);
            width: 40px;
            height: 40px;
            padding: 0;
            border: 0;
            background: transparent;
            color: rgba(255, 255, 255, .72);
            font-size: 26px;
            line-height: 1;
            box-shadow: none;
        }

        #closeGiftMedia:hover,
        #closeGiftMedia:focus-visible {
            color: #fff;
            outline: 2px solid rgba(255, 255, 255, .7);
            outline-offset: 2px;
        }

        @keyframes gift-wiggle {

            0%,
            21%,
            100% {
                transform: rotate(0);
            }

            5% {
                transform: rotate(-12deg);
            }

            9% {
                transform: rotate(12deg);
            }

            13% {
                transform: rotate(-8deg);
            }

            17% {
                transform: rotate(6deg);
            }
        }

        #settingsBtn {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 44px;
            height: 44px;
            padding: 0;
            font-size: 22px;
            background: var(--panel);
            color: #fff;
            box-shadow: 0 4px 0 var(--ink);
        }

        #settingsPanel {
            display: none;
            position: absolute;
            inset: 0;
            z-index: 5;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 18px;
            background: rgba(12, 18, 42, .98);
            overflow: auto;
            scrollbar-width: none;
            color: #fff;
        }

        #settingsPanel.open {
            display: flex;
        }

        #settingsPanel h2 {
            margin: 0 0 12px;
            font-size: 36px;
            font-weight: 400;
            color: #ffd45c;
            text-shadow: 3px 3px 0 var(--ink);
        }

        .setSec {
            width: 100%;
            max-width: 280px;
            background: var(--panel);
            border: 3px solid var(--ink);
            box-shadow: 4px 4px 0 var(--ink);
            padding: 10px 12px;
            margin-bottom: 12px;
            text-align: left;
        }

        .setSec h3 {
            margin: 0 0 8px;
            font-size: 20px;
            font-weight: 400;
            letter-spacing: 1px;
            color: #ffd45c;
        }

        .setRow {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .setRow+.setRow {
            margin-top: 10px;
        }

        #socialLinks {
            margin-top: 6px;
        }

        #socialLinks a {
            color: #ffd45c;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        #socialLinks img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
        }

        .small {
            padding: 6px 10px;
            font-size: 20px;
        }

        .ghost {
            background: #fff;
            box-shadow: 0 4px 0 #9aa4bd;
        }

        .seg {
            display: flex;
            gap: 8px;
        }

        .seg button {
            flex: 1;
            padding: 6px 4px;
            font-size: 20px;
            background: #fff;
            box-shadow: 0 4px 0 #9aa4bd;
        }

        .seg button.active {
            background: var(--gold);
            box-shadow: 0 4px 0 var(--gold-dark);
        }

        #setStatus {
            font-size: 16px;
            opacity: .8;
            min-height: 16px;
            margin-top: 6px;
        }

        #closeSettings {
            width: 100%;
            max-width: 280px;
            margin-top: 4px;
        }
    </style>
</head>

<body>
    <div id="wrap">
        <div id="stage">
            <canvas id="c" width="360" height="640"></canvas>
            <div id="nameRow">
                <input id="name" maxlength="14" placeholder="Nhập" autocomplete="off">
                <span id="nameDisplay" hidden></span>
                <button id="nameEditBtn" type="button" aria-label="Đổi tên" title="Đổi tên" hidden>✏️</button>
            </div>
            <div id="overlay" class="hidden">
                <button id="giftLinkBtn" type="button" aria-label="Mở quà tặng" aria-haspopup="dialog"
                    title="Mở quà tặng">🎁</button>
                <button id="settingsBtn" type="button" aria-label="Cài đặt">⚙️</button>
                <h1 id="gameTitle">GAME OVER</h1>
                <div id="deathMemeWrap">
                    <img id="deathMeme" src="catmeme.png" alt="Ảnh meme khi thua">
                    <span id="deathMemeText">Gàaaaaa</span>
                </div>
                <img id="highScoreImage" src="viettiep.jpg" alt="Ảnh thưởng khi đạt từ 100 điểm">
                <p id="sub">Chạm để tung cánh. Tránh ống nhé mấy cưng!</p>
                <div id="result" style="display:none">
                    <div class="scoreRow"><span>HIGH SCORE</span><b id="bestScoreValue">0</b></div>
                    <div class="scoreRow"><span>SCORE</span><b id="currentScoreValue">0</b></div>
                </div>
                <button id="playBtn">Chơi</button>
                <div id="board">
                    <h2>🏆 RANK</h2>
                    <ol id="list">
                        <li>Đang tải...</li>
                    </ol>
                    <div id="status"></div>
                </div>

                <div id="settingsPanel">
                    <h2>⚙️ Cài đặt</h2>

                    <div class="setSec">
                        <h3>ÂM THANH</h3>
                        <div class="setRow">
                            <span>Tiếng trong game</span>
                            <button id="soundToggle" class="small" type="button">🔊 Bật</button>
                        </div>
                        <div class="setRow">
                            <span>Nhạc nền</span>
                            <button id="musicToggle" class="small" type="button">🎵 Bật</button>
                        </div>
                    </div>

                    <div class="setSec">
                        <h3>ẢNH ĐẠI DIỆN</h3>
                        <div class="setRow">
                            <img id="birdPreview" alt="Ảnh đại diện hình tròn">
                            <button id="birdImageButton" class="small" type="button">Chọn ảnh của bạn</button>
                            <button id="birdRemoveButton" class="small ghost" type="button">Xóa ảnh</button>
                            <input id="birdImageInput" type="file" accept="image/*" hidden>
                        </div>
                        <div id="setStatus"></div>
                    </div>

                    <div class="setSec">
                        <h3>GIAO DIỆN</h3>
                        <div class="seg">
                            <button id="themeDay" type="button">☀️ Buổi trưa</button>
                            <button id="themeNight" type="button">🌙 Buồi túi</button>
                        </div>
                    </div>

                    <div class="setSec">
                        <h3>Nguồn</h3>
                        <div style="font-size:16px;opacity:.8">DEV</div>
                        <div id="socialLinks"></div>
                    </div>

                    <button id="closeSettings" type="button">Xong</button>
                </div>
            </div>
        </div>
    </div>
    <div id="giftMediaModal" role="dialog" aria-modal="true" aria-label="Video quà tặng" hidden>
        <video src="zalocrepy.mp4" playsinline aria-label="Video quà tặng"></video>
        <button id="closeGiftMedia" type="button" aria-label="Đóng video quà tặng" title="Đóng">×</button>
    </div>

    <script>
        /* ============================================================
           CẤU HÌNH BẢNG XẾP HẠNG CHUNG (Firebase Firestore)
           - Để trống 2 dòng dưới: BXH chỉ lưu trên máy này (chơi thử).
           - Điền vào: BXH chung cho cả nhóm bạn bè.
           ============================================================ */
        const FIREBASE_PROJECT_ID = "khanhnekk";
        const FIREBASE_API_KEY = "AIzaSyALWXuYBHHnCRIV-bTl4oUCeRuoS4YE4nY";
        const CUSTOM_FLAP_SOUND = "vocanh.mp3"; // e.g. "vot-canh.mp3"
        const CUSTOM_SCORE_SOUND = "ting.mp3"; // e.g. "qua-cot.mp3"
        const CUSTOM_DEATH_SOUND = "catmemesound.mp3"; // e.g. "khi-chet.mp3"
        const CUSTOM_EXTRA_DEATH_SOUND = "chet.mp3";
        const HIGH_SCORE_DEATH_SOUND = new Audio("siren head.mp3");
        const BONUS_IMAGE_PATH = "chotiep.jpg";
        const PLANE_IMAGE_PATH = "vietjet.png";
        const TOWER_IMAGE_PATH = "thapdoi.png";
        const BACKGROUND_MUSIC_PATH = "ffob1.mp3";
        const CLOUD_IMAGE_PATH = "chotiep.jpg";
        const AVATAR_SIZE = 96; // Kích thước ảnh đại diện (px) khi lưu lên BXH
        const BACKGROUND_MUSIC_BASE_VOLUME = 0.35;
        const MASTER_VOLUME = 0.1;

        const $ = id => document.getElementById(id);
        const AUTHOR_FACEBOOK_URL = "https://www.facebook.com/hw.khanh";
        const giftLinkButton = $("giftLinkBtn");
        const giftMediaModal = $("giftMediaModal");
        const giftVideo = giftMediaModal.querySelector("video");
        const closeGiftMediaButton = $("closeGiftMedia");
        let giftVideoGain = null;
        const closeGiftMedia = () => {
            giftMediaModal.hidden = true;
            giftMediaModal.setAttribute("aria-hidden", "true");
            giftVideo.pause();
            giftLinkButton.focus();
        };
        giftLinkButton.addEventListener("click", () => {
            giftMediaModal.hidden = false;
            giftMediaModal.setAttribute("aria-hidden", "false");
            closeGiftMediaButton.focus();
            const audio = getGameAudio();
            if (audio) {
                try {
                    if (!giftVideoGain) {
                        const source = audio.createMediaElementSource(giftVideo);
                        giftVideoGain = audio.createGain();
                        giftVideoGain.gain.value = 1.5;
                        source.connect(giftVideoGain);
                        giftVideoGain.connect(audio.destination);
                    }
                    if (audio.state === "suspended") {
                        audio.resume().catch(error => console.error("Không thể bật âm thanh video quà tặng:", error));
                    }
                } catch (error) {
                    console.error("Không thể tăng âm lượng video quà tặng:", error);
                }
            }
            giftVideo.play().catch(error => console.error("Không thể phát video quà tặng:", error));
        });
        closeGiftMediaButton.addEventListener("click", closeGiftMedia);
        giftMediaModal.addEventListener("click", event => {
            if (event.target === giftMediaModal) closeGiftMedia();
        });
        window.addEventListener("keydown", event => {
            if (event.key === "Escape" && !giftMediaModal.hidden) {
                closeGiftMedia();
            }
        });

        function renderAuthorFacebook() {
            const container = $("socialLinks");
            let url;
            try {
                url = new URL(AUTHOR_FACEBOOK_URL);
            } catch (error) {
                console.error("Link Facebook tác giả không hợp lệ", error);
                container.textContent = "Link Facebook tác giả không hợp lệ.";
                return;
            }
            if (url.protocol !== "https:" && url.protocol !== "http:") {
                container.textContent = "Link Facebook tác giả phải dùng http:// hoặc https://.";
                return;
            }

            const link = document.createElement("a");
            link.href = url.href;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            const image = document.createElement("img");
            image.src = "lhk.png";
            image.alt = "";
            image.alt = "Facebook tác giả";
            link.appendChild(image);
            container.appendChild(link);
        }
        renderAuthorFacebook();

        /* -------------------- Cài đặt người chơi -------------------- */
        const DEFAULT_SETTINGS = { sound: true, music: true, theme: "day" };
        let settings = { ...DEFAULT_SETTINGS };
        try {
            Object.assign(settings, JSON.parse(localStorage.getItem("chimbay_settings") || "{}"));
        } catch (e) { }
        settings.sound = settings.sound !== false;
        settings.music = settings.music !== false;
        if (settings.theme !== "day" && settings.theme !== "night") settings.theme = "day";

        function saveSettings() {
            try { localStorage.setItem("chimbay_settings", JSON.stringify(settings)); } catch (e) { }
        }

        function soundOn() { return settings.sound && MASTER_VOLUME > 0; }

        function setMsg(text) { $("setStatus").textContent = text; }

        function syncSettingsUI() {
            $("soundToggle").textContent = settings.sound ? "🔊 Bật" : "🔇 Tắt";
            $("musicToggle").textContent = settings.music ? "🎵 Bật" : "🔇 Tắt";
            $("themeDay").classList.toggle("active", settings.theme === "day");
            $("themeNight").classList.toggle("active", settings.theme === "night");
        }

        /* ---------------------- Bảng xếp hạng ---------------------- */
        const useCloud = !!(FIREBASE_PROJECT_ID && FIREBASE_API_KEY);
        const FS = `https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT_ID}/databases/(default)/documents`;

        function dedupeTop(rows, n = 15) {
            const best = new Map();
            for (const r of rows) {
                const k = r.name.trim().toLowerCase();
                if (!best.has(k) || best.get(k).score < r.score) best.set(k, r);
            }
            return [...best.values()].sort((a, b) => b.score - a.score).slice(0, n);
        }

        async function getScores() {
            if (!useCloud) {
                let all = {};
                try { all = JSON.parse(localStorage.getItem("chimbay_scores") || "{}"); } catch (e) { }
                return dedupeTop(Object.entries(all).map(([name, score]) => ({ name, score })));
            }
            const res = await fetch(`${FS}:runQuery?key=${FIREBASE_API_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    structuredQuery: {
                        from: [{ collectionId: "scores" }],
                        orderBy: [{ field: { fieldPath: "score" }, direction: "DESCENDING" }],
                        limit: 60
                    }
                })
            });
            if (!res.ok) throw new Error("HTTP " + res.status);
            const data = await res.json();
            const rows = data.filter(d => d.document).map(d => ({
                name: d.document.fields.name.stringValue,
                score: parseInt(d.document.fields.score.integerValue, 10)
            }));
            return dedupeTop(rows);
        }

        async function submitScore(name, score) {
            if (!useCloud) {
                let all = {};
                try { all = JSON.parse(localStorage.getItem("chimbay_scores") || "{}"); } catch (e) { }
                if (!all[name] || all[name] < score) all[name] = score;
                try { localStorage.setItem("chimbay_scores", JSON.stringify(all)); } catch (e) { }
                return;
            }
            const res = await fetch(`${FS}/scores?key=${FIREBASE_API_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    fields: {
                        name: { stringValue: name },
                        score: { integerValue: String(score) },
                        t: { integerValue: String(Date.now()) }
                    }
                })
            });
            if (!res.ok) throw new Error("HTTP " + res.status);
        }

        async function renamePlayerScores(oldName, newName) {
            if (!oldName || oldName === newName) return;
            if (!useCloud) {
                let all = {};
                try { all = JSON.parse(localStorage.getItem("chimbay_scores") || "{}"); } catch (error) {
                    console.error("Không đọc được BXH trên thiết bị", error);
                    throw error;
                }
                if (Object.prototype.hasOwnProperty.call(all, oldName)) {
                    all[newName] = Math.max(Number(all[newName]) || 0, Number(all[oldName]) || 0);
                    delete all[oldName];
                    try {
                        localStorage.setItem("chimbay_scores", JSON.stringify(all));
                    } catch (error) {
                        console.error("Không lưu được BXH sau khi đổi tên", error);
                        throw error;
                    }
                }
                return;
            }

            const query = await fetch(`${FS}:runQuery?key=${FIREBASE_API_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    structuredQuery: {
                        from: [{ collectionId: "scores" }],
                        where: {
                            fieldFilter: {
                                field: { fieldPath: "name" },
                                op: "EQUAL",
                                value: { stringValue: oldName }
                            }
                        }
                    }
                })
            });
            if (!query.ok) throw new Error("Không tìm thấy điểm cũ: HTTP " + query.status);

            const rows = await query.json();
            const documents = rows.filter(row => row.document).map(row => row.document);
            for (let offset = 0; offset < documents.length; offset += 500) {
                const writes = documents.slice(offset, offset + 500).map(document => ({
                    update: {
                        name: document.name,
                        fields: { name: { stringValue: newName } }
                    },
                    updateMask: { fieldPaths: ["name"] }
                }));
                const commit = await fetch(`https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT_ID}/databases/(default)/documents:commit?key=${FIREBASE_API_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ writes })
                });
                if (!commit.ok) throw new Error("Không cập nhật được điểm cũ: HTTP " + commit.status);
            }
        }

        // nên đổi ảnh là cập nhật ngay, không phụ thuộc vào điểm cao.
        function playerId(name) {
            return [...new TextEncoder().encode(name.trim().toLowerCase())]
                .map(b => b.toString(16).padStart(2, "0")).join("");
        }

                const data = await res.json();
                const map = {};
                (data.documents || []).forEach(d => {
                    const f = d.fields || {};
                    if (f.name && f.avatar) map[f.name.stringValue.trim().toLowerCase()] = f.avatar.stringValue;
                });
                return map;
            } catch (e) {

                list.innerHTML = "";

                    avatar.className = "avatar";
                    avatar.setAttribute("aria-hidden", "true");
                    if (avatar.tagName === "IMG") {
                        avatar.src = src;
                        avatar.alt = "";
                        avatar.addEventListener("error", () => {
                            const fallback = document.createElement("span");
                            fallback.className = "avatar";

                            fallback.textContent = r.name.trim().charAt(0).toUpperCase() || "?";

                    name.className = "nm";
                    name.textContent = r.name;

        function playTone(startFrequency, endFrequency, duration, volume, type = "sine") {
            if (!soundOn()) return;
            const audio = getGameAudio();
            if (!audio) return;
            if (audio.state === "suspended") {
                audio.resume().catch(error => console.error("Không thể bật âm thanh", error));
            }

            const level = Math.max(0.0001, volume * MASTER_VOLUME);
            const now = audio.currentTime;
            const oscillator = audio.createOscillator();
            const gain = audio.createGain();
            oscillator.type = type;
            oscillator.frequency.setValueAtTime(startFrequency, now);
            oscillator.frequency.exponentialRampToValueAtTime(endFrequency, now + duration);
            gain.gain.setValueAtTime(0.0001, now);
            gain.gain.exponentialRampToValueAtTime(level, now + 0.015);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
            oscillator.connect(gain);
            gain.connect(audio.destination);
            oscillator.start(now);
            oscillator.stop(now + duration + 0.02);
        }

        function createExplosion(x, y, towerStyle = 0) {
            const planeColors = ["#f4f6f8", "#4c83b4", "#b8c8d6", "#83c9e8", "#26384c"];
            const tower = BUILDING_STYLES[towerStyle % BUILDING_STYLES.length];
            const debrisColors = [...planeColors, tower.wall, tower.shadow, tower.glass];
            const planeScale = planeImage && planeImage.naturalWidth
                ? Math.min(56 / planeImage.naturalWidth, 42 / planeImage.naturalHeight)
                : null;
            const planeWidth = planeScale ? planeImage.naturalWidth * planeScale : 50;
            const planeHeight = planeScale ? planeImage.naturalHeight * planeScale : 36;
            const splitAt = planeWidth * 0.62;
            const localFragments = [
                { side: "tail", centerX: -planeWidth / 2 + splitAt / 2, sourceX: 0, sourceWidth: planeScale ? splitAt / planeScale : 0 },
                { side: "nose", centerX: -planeWidth / 2 + (splitAt + planeWidth) / 2, sourceX: planeScale ? splitAt / planeScale : 0, sourceWidth: planeScale ? (planeWidth - splitAt) / planeScale : 0 }
            ];
            const cos = Math.cos(bird.rot), sin = Math.sin(bird.rot);
            for (const fragment of localFragments) {
                explosionParticles.push({
                    x: bird.x + fragment.centerX * cos,
                    y: bird.y + fragment.centerX * sin,
                    vx: fragment.side === "nose" ? 54 : -46,
                    vy: fragment.side === "nose" ? -18 : -62,
                    age: 0,
                    ttl: 2.4,
                    rotation: bird.rot,
                    spin: fragment.side === "nose" ? 2.1 : -1.6,
                    kind: "planeFragment",
                    side: fragment.side,
                    sourceX: fragment.sourceX,
                    sourceWidth: fragment.sourceWidth,
                    width: fragment.side === "nose" ? planeWidth - splitAt : splitAt,
                    height: planeHeight
                });
            }

            explosionParticles.push({
                x, y, vx: 0, vy: 0, spin: 0, rotation: 0, size: 5, age: 0, ttl: 0.22, kind: "flash"
            });
            for (let i = 0; i < 30; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 70 + Math.random() * 230;
                explosionParticles.push({
                    x: x + (Math.random() - 0.5) * 26,
                    y: y + (Math.random() - 0.5) * 18,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 25,
                    size: 3 + Math.random() * 7,
                    color: debrisColors[Math.floor(Math.random() * debrisColors.length)],
                    age: 0,
                    ttl: 0.55 + Math.random() * 0.55,
                    rotation: Math.random() * Math.PI,
                    spin: (Math.random() - 0.5) * 12,
                    kind: "debris"
                });
            }
            for (let i = 0; i < 14; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 50 + Math.random() * 170;
                explosionParticles.push({
                    x, y,

                    size: 3 + Math.random() * 5,
                    color: ["#ffec8a", "#ff9b38", "#f04b37"][i % 3],

                    ttl: 0.35 + Math.random() * 0.3,
                    rotation: 0,
                    spin: 0,
                    kind: "fire"
                });

            for (let i = 0; i < 12; i++) {

        function drawTowerScorch(x, y) {
            ctx.save();
            ctx.translate(x, y);
            ctx.fillStyle = "rgba(20,18,18,.78)";
            ctx.beginPath();
            ctx.ellipse(0, 0, 11, 15, -0.25, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "rgba(5,5,5,.72)";
            ctx.fillRect(-7, -9, 8, 12);
            ctx.fillRect(1, -5, 6, 13);
            ctx.strokeStyle = "rgba(20,15,15,.9)";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-2, -9);
            ctx.lineTo(-5, -15);
            ctx.moveTo(3, 5);
            ctx.lineTo(7, 11);
            ctx.stroke();
            ctx.restore();
        }

        function drawTowerFire(x, y) {
            const time = performance.now() / 90;
            ctx.save();
            ctx.translate(x, y);

            const pulse = (Math.sin(time) + 1) / 2;
            ctx.globalAlpha = 0.2 + pulse * 0.12;
            ctx.fillStyle = "#ff6b18";
            ctx.fillRect(-22, -24, 44, 30);
            ctx.globalAlpha = 1;

            for (let flame = 0; flame < 3; flame++) {
                const sway = Math.sin(time * 1.4 + flame * 2.1) * 3;
                const height = 17 + ((Math.sin(time + flame * 2) + 1) * 5);
                const baseX = -12 + flame * 11;
                ctx.fillStyle = flame === 1 ? "#ff4b24" : "#e93620";
                ctx.beginPath();
                ctx.moveTo(baseX - 7, 8);
                ctx.lineTo(baseX - 8, -1);
                ctx.lineTo(baseX - 3 + sway, -height * 0.55);
                ctx.lineTo(baseX - 1 + sway, -height);
                ctx.lineTo(baseX + 3, -height * 0.52);
                ctx.lineTo(baseX + 6 + sway, -height * 0.78);
                ctx.lineTo(baseX + 8, 8);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = "#ff9d24";
                ctx.beginPath();
                ctx.moveTo(baseX - 4, 7);
                ctx.lineTo(baseX - 3 - sway * 0.35, -height * 0.42);
                ctx.lineTo(baseX + 1, -height * 0.68);
                ctx.lineTo(baseX + 4 + sway * 0.3, -height * 0.28);
                ctx.lineTo(baseX + 5, 7);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = "#ffe779";
                ctx.fillRect(baseX - 1, -height * 0.28, 4, height * 0.38);
            }

            for (let i = 0; i < 4; i++) {
                const rise = (time * (0.7 + i * 0.12) + i * 9) % 34;
                const puffX = Math.sin(time * 0.45 + i * 1.8) * (5 + i * 2);
                ctx.globalAlpha = 0.48 - i * 0.08;
                ctx.fillStyle = i % 2 ? "#555461" : "#3d4052";
                const size = 7 + i * 2;
                ctx.fillRect(puffX, -22 - rise, size, size);
                ctx.fillRect(puffX - size * 0.6, -18 - rise, size, size * 0.7);
                ctx.fillRect(puffX + size * 0.5, -17 - rise, size * 0.65, size * 0.65);
            }

            ctx.globalAlpha = 1;
            for (let i = 0; i < 5; i++) {
                const phase = (time * (0.8 + i * 0.13) + i * 7) % 30;
                const emberX = Math.sin(time * 0.8 + i * 2.7) * (8 + i * 2);
                ctx.fillStyle = i % 2 ? "#ffe779" : "#ff6b25";
                ctx.fillRect(emberX, -12 - phase, 2, 3);
                ctx.fillRect(emberX + 3, -17 - phase, 2, 2);
            }
            ctx.restore();
        }

            const imageUrl = URL.createObjectURL(file);

            image.onload = () => {

                // Cắt vuông ở giữa rồi thu nhỏ còn AVATAR_SIZE x AVATAR_SIZE
                const side = Math.min(image.naturalWidth, image.naturalHeight);
                const sx = (image.naturalWidth - side) / 2;
                const sy = (image.naturalHeight - side) / 2;
                const canvas = document.createElement("canvas");
                canvas.width = AVATAR_SIZE;
                canvas.height = AVATAR_SIZE;
                canvas.getContext("2d").drawImage(image, sx, sy, side, side, 0, 0, AVATAR_SIZE, AVATAR_SIZE);
                const dataUrl = canvas.toDataURL("image/jpeg", 0.8);
                setBirdImage(dataUrl);
                try {
                    localStorage.setItem("chimbay_bird_image", dataUrl);
                    setMsg(useCloud
                        ? "Đã chọn ảnh. Ảnh sẽ hiện trên BXH khi bạn bấm Chơi"
                        : "Ảnh đại diện đã lưu trên thiết bị này");
                } catch (error) {
                    console.error("Không thể lưu ảnh đại diện", error);
                    setMsg("Không đủ bộ nhớ để lưu ảnh trên thiết bị");
                }
                event.target.value = "";
            };
            image.onerror = () => {
                URL.revokeObjectURL(imageUrl);
                console.error("Không thể đọc ảnh đã chọn");
                setMsg("Không thể mở ảnh đã chọn");
                event.target.value = "";
            };
            image.src = imageUrl;
        });

        $("birdRemoveButton").addEventListener("click", () => {
            if (!birdImageData) { setMsg("Bạn chưa chọn ảnh nào"); return; }
            birdImage = null;
            birdImageData = "";
            $("birdPreview").style.display = "none";

            if (useCloud && playerName) {
                deletePlayer(playerName)
                    .then(() => { setMsg("Đã xóa ảnh"); renderBoard(playerName); })
                    .catch(error => {

                        setMsg("Đã xóa trên máy này, nhưng chưa xóa được trên BXH");
                    });
            } else {
                setMsg("Đã xóa ảnh");
            }
            renderBoard(playerName);
        });

        /* ------------------- Điều khiển cài đặt ------------------- */
        $("settingsBtn").addEventListener("click", () => {
            syncSettingsUI();
            setMsg("");
            $("settingsPanel").classList.add("open");
        });
        $("closeSettings").addEventListener("click", () => $("settingsPanel").classList.remove("open"));

        $("soundToggle").addEventListener("click", () => {
            settings.sound = !settings.sound;
            saveSettings();
            syncSettingsUI();
            if (settings.sound) playFlapSound();
        });
        $("musicToggle").addEventListener("click", () => {

            saveSettings();
            syncSettingsUI();
            if (settings.music) startBackgroundMusic();
            else stopBackgroundMusic();
        });
        $("themeDay").addEventListener("click", () => { settings.theme = "day"; saveSettings(); syncSettingsUI(); });
        $("themeNight").addEventListener("click", () => { settings.theme = "night"; saveSettings(); syncSettingsUI(); });
        syncSettingsUI();

        function syncNameEditUI() {
            const inp = $("name");
            const editing = !playerName || nameEditing;
            inp.hidden = !editing;
            $("nameDisplay").hidden = editing;
            $("nameDisplay").textContent = playerName;
            $("nameEditBtn").hidden = !playerName;
        }

        let nameEditing = false;

        syncNameEditUI();

        $("nameEditBtn").addEventListener("click", () => {
            nameEditing = true;
            syncNameEditUI();
            $("name").focus();
            $("name").select();
            $("status").textContent = "";
        });
        $("name").addEventListener("input", syncNameEditUI);

        function reset() {
            bird = { x: 90, y: H / 2 - 40, vy: 0, rot: 0, flapT: 0 };
            pipes = []; score = 0; spawnT = 0.9; deadT = 0;
            bonusPopups = [];
            explosionParticles = [];
            planeExploded = false;
            groundImagePasses = [];
        }
        reset();

        function flap() {
            if (state === "ready") { state = "play"; }
            if (state === "play") {
                bird.vy = FLAP;
                bird.flapT = 0.15;
                playFlapSound();
            }
        }

        function addPipe() {
            const min = 90, max = H - GROUND - GAP - 90;
            pipes.push({
                x: W + 10,
                top: min + Math.random() * (max - min),
                passed: false,
                style: Math.floor(Math.random() * BUILDING_STYLES.length)
            });
        }

        function die(impactX = bird.x, impactY = bird.y, towerStyle = 0) {
            if (state !== "play") return;
            state = "over"; deadT = 0;
            createExplosion(impactX, impactY, towerStyle);
            const finalScore = score;
            personalBestScore = Math.max(personalBestScore, finalScore);
            try {
                localStorage.setItem("chimbay_best_score", String(personalBestScore));
            } catch (error) {
                console.error("Không thể lưu điểm cao nhất trên thiết bị", error);
            }
            playDeathSound();
            if (finalScore >= 100) {
                playHighScoreDeathSound();
            }
            setTimeout(async () => {
                showOverlay(true, finalScore);
                if (finalScore > 0) {
                    if (playerName) {
                        try { await submitScore(playerName, finalScore); } catch (e) { $("status").textContent = "Không gửi được điểm lên BXH"; }
                    } else {
                        pendingScore = finalScore;
                    }
                }
                renderBoard(playerName);
                if (pendingScore !== null) $("status").textContent = "Nhập tên rồi bấm PLAY để lưu điểm lên BXH.";
            }, 1700);
        }

        function update(dt) {
            if (state !== "over") scrollX += SPEED * dt;
            cloudsX = cloudsX.map(x => (x - 12 * dt < -70 ? W + 20 : x - 12 * dt));
            bonusPopups = bonusPopups.filter(item => {
                item.age += dt;
                return item.age < item.ttl;
            });
            explosionParticles = explosionParticles.filter(particle => {
                particle.age += dt;
                particle.x += particle.vx * dt;
                particle.y += particle.vy * dt;
                particle.vy += (particle.kind === "smoke" ? -12 : 520) * dt;
                particle.vx *= Math.max(0, 1 - (particle.kind === "smoke" ? 0.7 : 1.4) * dt);
                particle.rotation += particle.spin * dt;
                return particle.age < particle.ttl;
            });
            groundImagePasses = groundImagePasses.filter(item => {
                item.x -= item.speed * dt;
                return item.x > -item.size;
            });

            if (state === "menu" || state === "ready") {
                bird.y = H / 2 - 40 + Math.sin(performance.now() / 200) * 8;
                bird.flapT = Math.max(0, Math.sin(performance.now() / 120)) * 0.1;
                return;
            }
            if (state === "play" || state === "over") {
                bird.vy += FALL_GRAVITY * dt;
                bird.y += bird.vy * dt;
                bird.rot = Math.max(-0.5, Math.min(1.1, bird.vy / 620));
                bird.flapT = Math.max(0, bird.flapT - dt);
            }
            if (state === "play") {
                spawnT -= dt;
                if (spawnT <= 0) { addPipe(); spawnT = SPAWN; }
                for (const p of pipes) {
                    p.x -= SPEED * dt;
                    if (!p.passed && p.x + PIPE_W < bird.x - 12) {
                        p.passed = true;
                        score++;
                        playScoreSound();
                        if (score === 10) {
                            groundImagePasses.push({ x: W, size: 58, speed: 140 });
                        }
                    }
                    const bx = bird.x, by = bird.y, r = 12;
                    const bottomY = p.top + GAP;
                    if (bx + r > p.x && bx - r < p.x + PIPE_W && (by - r < p.top || by + r > p.top + GAP)) {
                        const impactX = Math.max(p.x, Math.min(p.x + PIPE_W, bx));
                        if (by < p.top) {
                            p.topScorch = { x: impactX - p.x, y: Math.max(0, Math.min(p.top + 4, by + 4)) };
                        } else {
                            p.bottomScorch = { x: impactX - p.x, y: Math.max(0, Math.min(H - bottomY, by - bottomY)) };
                        }
                        die(bx, by, p.style);
                        break;
                    }
                }
                pipes = pipes.filter(p => p.x > -PIPE_W - 10);
                if (bird.y + 12 >= H - GROUND) { bird.y = H - GROUND - 12; die(); }
                if (bird.y < -20) bird.y = -20;
            }
            if (state === "over" && bird.y + 12 >= H - GROUND) { bird.y = H - GROUND - 12; bird.vy = 0; }
        }

        /* --------------------------- Vẽ --------------------------- */
        function pixelDisc(cx, cy, r, color) {
            ctx.fillStyle = color;
            for (let dy = -r; dy < r; dy += 4) {
                const hw = Math.round(Math.sqrt(r * r - (dy + 2) * (dy + 2)) / 4) * 4;
                ctx.fillRect(cx - hw, cy + dy, hw * 2, 4);
            }
        }

        function drawMountains(offset, base, amp, seed, color) {
            const floor = H - GROUND;
            ctx.fillStyle = color;
            for (let x = 0; x < W; x += 8) {
                const wx = x + offset;
                const raw = base + Math.sin(wx * 0.011 + seed) * amp + Math.sin(wx * 0.027 + seed * 2) * amp * 0.4;
                const h = Math.round(raw / 8) * 8;
                ctx.fillRect(x, floor - h, 8, h);
            }
        }

        function pixCloud(x, y, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x + 12, y, 28, 8);
            ctx.fillRect(x, y + 8, 56, 8);
            ctx.fillRect(x + 8, y + 16, 40, 4);
        }

        function drawCloud(x, y, theme) {
            if (cloudImage && cloudImage.complete && cloudImage.naturalWidth) {
                ctx.save();
                ctx.globalCompositeOperation = "screen";
                const scale = Math.min(72 / cloudImage.naturalWidth, 88 / cloudImage.naturalHeight);
                const width = cloudImage.naturalWidth * scale;
                const height = cloudImage.naturalHeight * scale;
                ctx.drawImage(cloudImage, x + (56 - width) / 2, y - height / 2, width, height);
                ctx.restore();
            } else {
                pixCloud(Math.round(x / 4) * 4, Math.round(y / 4) * 4, theme.cloud);
            }
        }

        function drawAtmosphericSmoke(offset) {
            const repeatWidth = 340;
            const shift = offset % repeatWidth;
            for (let block = -1; block < W / repeatWidth + 2; block++) {
                const x = block * repeatWidth - shift;
                ctx.fillStyle = "rgba(38, 39, 61, .48)";
                ctx.beginPath();
                ctx.ellipse(x + 105, 50, 118, 34, -0.08, 0, Math.PI * 2);
                ctx.ellipse(x + 190, 38, 104, 32, 0.06, 0, Math.PI * 2);
                ctx.ellipse(x + 260, 54, 112, 29, 0.12, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = "rgba(53, 53, 79, .42)";
                ctx.beginPath();
                ctx.ellipse(x + 64, 77, 92, 27, -0.12, 0, Math.PI * 2);
                ctx.ellipse(x + 148, 70, 116, 31, 0.04, 0, Math.PI * 2);
                ctx.ellipse(x + 240, 78, 105, 24, 0.1, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = "rgba(113, 119, 154, .16)";
                ctx.beginPath();
                ctx.ellipse(x + 102, 99, 102, 17, 0.04, 0, Math.PI * 2);
                ctx.ellipse(x + 227, 96, 116, 18, -0.08, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawGroundBuilding(x, groundY, width, height, variant) {
            const style = BUILDING_STYLES[variant % BUILDING_STYLES.length];
            const top = groundY - height;
            ctx.fillStyle = style.shadow;
            ctx.fillRect(x, top, width, height);
            ctx.fillStyle = style.wall;
            ctx.fillRect(x + 3, top, width - 5, height);
            ctx.fillStyle = "rgba(255,255,255,.18)";
            ctx.fillRect(x + 5, top + 2, 2, height - 2);

            if (variant === 0) {
                ctx.fillStyle = style.roof;
                ctx.fillRect(x - 2, top, width + 3, 5);
                ctx.fillRect(x + width / 2 - 2, top - 8, 4, 8);
            } else if (variant === 1) {
                ctx.fillStyle = style.roof;
                ctx.fillRect(x + 4, top - 7, width - 7, 8);
                ctx.fillRect(x + 9, top - 12, width - 16, 6);
            } else {
                ctx.fillStyle = style.roof;
                ctx.fillRect(x + 2, top - 4, width - 4, 6);
                ctx.fillRect(x + width - 8, top - 11, 3, 10);
            }

            const columns = Math.max(2, Math.floor((width - 10) / 7));
            const rows = Math.floor((height - 8) / 10);
            for (let row = 0; row < rows; row++) {
                for (let column = 0; column < columns; column++) {
                    const windowX = x + 7 + column * 7;
                    const windowY = top + 8 + row * 10;
                    const isLit = settings.theme === "night" && (row * 7 + column * 11 + variant * 3) % 5 === 0;
                    ctx.fillStyle = isLit ? style.lit : style.glass;
                    ctx.fillRect(windowX, windowY, 4, 6);
                    ctx.fillStyle = "rgba(25,35,48,.4)";
                    ctx.fillRect(windowX, windowY + 5, 4, 1);
                }
            }
        }

        const BUILDING_STYLES = [
            { wall: "#607b9c", shadow: "#344b69", glass: "#a6d8e8", lit: "#ffe49a", roof: "#293d5a" },
            { wall: "#71808c", shadow: "#414f5d", glass: "#8dc8db", lit: "#ffe49a", roof: "#303d4a" },
            { wall: "#647d83", shadow: "#354e55", glass: "#a3d6ce", lit: "#ffe49a", roof: "#293f43" }
        ];

        function drawSkyscraper(x, y, h, roofAtBottom, styleIndex) {
            if (h <= 0) return;
            if (towerImage && towerImage.complete && towerImage.naturalWidth) {
                if (roofAtBottom) {
                    ctx.save();
                    ctx.translate(x, y + h);
                    ctx.scale(1, -1);
                    ctx.drawImage(towerImage, 0, 0, PIPE_W, h);
                    ctx.restore();
                } else {
                    ctx.drawImage(towerImage, x, y, PIPE_W, h);
                }
                return;
            }
            const style = BUILDING_STYLES[styleIndex % BUILDING_STYLES.length];
            const roofY = roofAtBottom ? y + h - 8 : y;

            ctx.fillStyle = style.wall;
            ctx.fillRect(x, y, PIPE_W, h);
            ctx.fillStyle = style.shadow;
            ctx.fillRect(x, y, 7, h);
            ctx.fillRect(x + PIPE_W - 5, y, 5, h);
            ctx.fillStyle = "rgba(255,255,255,.16)";
            ctx.fillRect(x + 8, y, 2, h);

            ctx.save();
            ctx.beginPath();
            ctx.rect(x, y, PIPE_W, h);
            ctx.clip();
            const firstFloor = Math.floor((y - 8) / 26);
            const lastFloor = Math.ceil((y + h) / 26);
            for (let floor = firstFloor; floor <= lastFloor; floor++) {
                const windowY = floor * 26 + 5;
                for (let column = 0; column < 3; column++) {
                    const windowX = x + 11 + column * 13;
                    const isLit = (floor * 7 + column * 11 + styleIndex * 5) % 6 === 0;
                    ctx.fillStyle = isLit ? style.lit : style.glass;
                    ctx.fillRect(windowX, windowY, 8, 13);
                    ctx.fillStyle = "rgba(30,48,67,.35)";
                    ctx.fillRect(windowX, windowY + 12, 8, 1);
                }
                ctx.fillStyle = style.shadow;
                ctx.fillRect(x + 7, floor * 26 + 22, PIPE_W - 12, 2);
            }
            ctx.restore();

            ctx.fillStyle = style.roof;
            ctx.fillRect(x, roofY, PIPE_W, 8);
            ctx.fillStyle = "#a9c4d0";
            ctx.fillRect(x + 4, roofY, PIPE_W - 8, 2);
            ctx.fillStyle = style.shadow;
            ctx.fillRect(x, y, 3, h);
            ctx.fillRect(x + PIPE_W - 3, y, 3, h);
        }

        function drawPipe(p) {
            const bottomY = p.top + GAP;
            drawSkyscraper(p.x, -4, p.top + 4, true, p.style);
            drawSkyscraper(p.x, bottomY, H - bottomY, false, p.style);
            if (p.topScorch) {
                const x = p.x + p.topScorch.x, y = -4 + p.topScorch.y;
                drawTowerScorch(x, y);
                if (state === "over") drawTowerFire(x, y);
            }
            if (p.bottomScorch) {
                const x = p.x + p.bottomScorch.x, y = bottomY + p.bottomScorch.y;
                drawTowerScorch(x, y);
                if (state === "over") drawTowerFire(x, y);
            }
        }

        function drawPlaneShape(points, fill, stroke = "#26384c") {
            ctx.beginPath();
            ctx.moveTo(points[0][0], points[0][1]);
            for (let i = 1; i < points.length; i++) ctx.lineTo(points[i][0], points[i][1]);
            ctx.closePath();
            ctx.fillStyle = fill;
            ctx.fill();
            ctx.strokeStyle = stroke;
            ctx.lineWidth = 1.5;
            ctx.stroke();
        }

        function drawCommercialPlane() {
            ctx.scale(0.82, 0.82);

            drawPlaneShape([[-1, -5], [-17, -20], [-11, -20], [3, -5], [6, 0], [-2, 1]], "#b8c8d6");
            drawPlaneShape([[-2, 0], [-17, 14], [-11, 15], [3, 1], [5, -4]], "#91a7bb");
            drawPlaneShape([[-17, -3], [-23, -13], [-18, -12], [-8, -3], [-15, 3]], "#426d9b");
            drawPlaneShape([[-17, 2], [-23, 10], [-18, 9], [-8, 2], [-15, -3]], "#426d9b");

            drawPlaneShape([
                [-25, -2], [-20, -5], [13, -5], [21, -3], [25, 0],
                [22, 3], [13, 5], [-20, 5], [-25, 2]
            ], "#f4f6f8");
            ctx.fillStyle = "#4c83b4";
            ctx.fillRect(-19, 2, 37, 2);
            ctx.fillStyle = "#426d9b";
            ctx.fillRect(-24, -2, 6, 4);

            ctx.fillStyle = "#3a5066";
            for (let x = -13; x <= 8; x += 5) ctx.fillRect(x, -2, 2, 1.5);
            ctx.fillStyle = "#83c9e8";
            ctx.fillRect(14, -3, 5, 2);

            ctx.fillStyle = "#d5e0e8";
            ctx.fillRect(-6, -10, 4, 2);
            ctx.fillRect(-6, 9, 4, 2);
        }

        function drawBird() {
            ctx.save();
            ctx.translate(bird.x, bird.y);
            ctx.rotate(bird.rot);
            if (birdImage) {
                ctx.beginPath();
                ctx.arc(0, 0, 17, 0, Math.PI * 2);
                ctx.clip();
                ctx.drawImage(birdImage, -17, -17, 34, 34);
                ctx.restore();
                ctx.beginPath();
                ctx.arc(bird.x, bird.y, 17, 0, Math.PI * 2);
                ctx.strokeStyle = "#1b2a49";
                ctx.lineWidth = 3;
                ctx.stroke();
                return;
            }
            if (planeImage && planeImage.complete && planeImage.naturalWidth) {
                const scale = Math.min(56 / planeImage.naturalWidth, 42 / planeImage.naturalHeight);
                const width = planeImage.naturalWidth * scale;
                const height = planeImage.naturalHeight * scale;
                ctx.drawImage(planeImage, -width / 2, -height / 2, width, height);
                ctx.restore();
                return;
            }
            drawCommercialPlane();
            ctx.restore();
        }

        function draw() {
            ctx.setTransform(S, 0, 0, S, 0, 0);
            const theme = THEMES[settings.theme] || THEMES.day;
            const skyH = H - GROUND;

            // trời: các dải màu
            const bandH = Math.ceil(skyH / theme.bands.length);
            theme.bands.forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(0, i * bandH, W, bandH + 1); });

            // sao (ban đêm)
            if (theme.stars) {
                const t = performance.now() / 700;
                ctx.fillStyle = "#fff";
                for (const s of STARS) {
                    ctx.globalAlpha = 0.45 + 0.55 * Math.sin(t + s.p);
                    ctx.fillRect(s.x, s.y, s.r, s.r);
                }
                ctx.globalAlpha = 1;
            }

            // mặt trời / mặt trăng
            if (theme.stars) {
                pixelDisc(272, 140, 34, "#eef0e6");
                ctx.fillStyle = "#d3d6c8";
                ctx.fillRect(260, 128, 8, 8); ctx.fillRect(282, 150, 8, 8); ctx.fillRect(264, 154, 4, 4);
            } else {
                pixelDisc(272, 150, 48, "#ffe3a8");
                pixelDisc(272, 150, 36, "#fff4cf");
            }

            drawAtmosphericSmoke(scrollX * 0.08);

            // núi xa, núi gần (cuộn chậm)
            drawMountains(scrollX * 0.12, 120, 34, 1.3, theme.mountFar);
            drawMountains(scrollX * 0.3, 64, 26, 4.1, theme.mountNear);

            // mây
            drawCloud(cloudsX[0], 110, theme); drawCloud(cloudsX[1], 200, theme); drawCloud(cloudsX[2], 70, theme);

            pipes.forEach(drawPipe);

            // đất: cỏ + đất nâu họa tiết ô vuông
            const gy = H - GROUND;
            ctx.fillStyle = "#b5733e"; ctx.fillRect(0, gy, W, GROUND);
            ctx.fillStyle = "#a2652f";
            const colShift = Math.floor(scrollX / 16), px = scrollX % 16;
            for (let c = 0; c < W / 16 + 2; c++) {
                for (let r = 0; r < 4; r++) {
                    if ((c + colShift + r) % 2 === 0) ctx.fillRect(c * 16 - px, gy + 20 + r * 16, 16, 16);
                }
            }
            ctx.fillStyle = "#6cc24a"; ctx.fillRect(0, gy, W, 14);
            ctx.fillStyle = "#4ca03a";
            for (let c = 0; c < W / 16 + 2; c++) ctx.fillRect(c * 16 - px, gy + 14, 8, 6);
            ctx.fillStyle = "#2f6b2a"; ctx.fillRect(0, gy, W, 3);
            const buildingSpacing = 48;
            const buildingOffset = scrollX % buildingSpacing;
            const firstBuilding = Math.floor(scrollX / buildingSpacing);
            const buildingWidths = [40, 48, 34, 52, 38, 46, 32, 50];
            const buildingHeights = [62, 88, 50, 74, 102, 57, 82, 68];
            for (let i = -2; i < W / buildingSpacing + 3; i++) {
                const buildingIndex = firstBuilding + i;
                const index = Math.abs(buildingIndex) % buildingWidths.length;
                const buildingX = i * buildingSpacing - buildingOffset;
                drawGroundBuilding(
                    buildingX,
                    gy + 14,
                    buildingWidths[index],
                    buildingHeights[index],
                    Math.abs(buildingIndex) % BUILDING_STYLES.length
                );
            }

            if (settings.theme === "night") {
                ctx.fillStyle = "rgba(10,20,50,.4)";
                ctx.fillRect(0, gy, W, GROUND);
            }

            if (bonusImage && bonusImage.complete && bonusImage.naturalWidth) {
                for (const item of groundImagePasses) {
                    const y = gy + (GROUND - item.size) / 2;
                    ctx.drawImage(bonusImage, item.x, y, item.size, item.size);
                }
            }

            if (!planeExploded) {
                drawBird();
            }

            for (const particle of explosionParticles) {
                const alpha = 1 - particle.age / particle.ttl;
                if (alpha <= 0) continue;
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.translate(particle.x, particle.y);
                if (particle.kind === "flash") {
                    const progress = particle.age / particle.ttl;
                    const radius = 38 * progress;
                    const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, radius);
                    gradient.addColorStop(0, "#fff8bd");
                    gradient.addColorStop(0.35, "#ffb52e");
                    gradient.addColorStop(1, "rgba(240,75,55,0)");
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(0, 0, radius, 0, Math.PI * 2);
                    ctx.fill();
                } else if (particle.kind === "smoke") {
                    const progress = particle.age / particle.ttl;
                    const radius = particle.size * (0.6 + progress * 1.1);
                    ctx.fillStyle = particle.color;
                    ctx.beginPath();
                    ctx.arc(0, 0, radius, 0, Math.PI * 2);
                    ctx.fill();
                } else if (particle.kind === "planeFragment") {
                    ctx.rotate(particle.rotation);
                    if (planeImage && planeImage.complete && planeImage.naturalWidth) {
                        ctx.drawImage(
                            planeImage,
                            particle.sourceX, 0, particle.sourceWidth, planeImage.naturalHeight,
                            -particle.width / 2, -particle.height / 2, particle.width, particle.height
                        );
                    } else {
                        ctx.fillStyle = "#f4f6f8";
                        if (particle.side === "nose") {
                            ctx.beginPath();
                            ctx.moveTo(-particle.width / 2, -5);
                            ctx.lineTo(particle.width / 2, -2);
                            ctx.lineTo(particle.width / 2, 2);
                            ctx.lineTo(-particle.width / 2, 5);
                            ctx.closePath();
                            ctx.fill();
                        } else {
                            drawPlaneShape([[-25, -2], [-20, -5], [10, -5], [5, 5], [-20, 5], [-25, 2]], "#f4f6f8");
                            drawPlaneShape([[-18, -3], [-23, -13], [-18, -12], [-8, -3], [-15, 3]], "#426d9b");
                        }
                    }
                } else {
                    ctx.rotate(particle.rotation);
                    ctx.fillStyle = particle.color;
                    if (particle.kind === "fire") {
                        ctx.beginPath();
                        ctx.arc(0, 0, particle.size * alpha, 0, Math.PI * 2);
                        ctx.fill();
                    } else {
                        ctx.fillRect(-particle.size / 2, -particle.size / 2, particle.size, particle.size);
                    }
                }
                ctx.restore();
            }

            if (state === "play" || state === "over") {
                ctx.font = "72px VT323, monospace"; ctx.textAlign = "center";
                ctx.lineJoin = "round";
                ctx.lineWidth = 8; ctx.strokeStyle = "#1b2a49"; ctx.strokeText(score, W / 2, 100);
                ctx.fillStyle = "#fff"; ctx.fillText(score, W / 2, 100);
            }
            if (state === "menu" || state === "ready" || state === "play") {
                ctx.save();
                ctx.textAlign = "right";
                ctx.lineJoin = "round";
                ctx.font = "bold 31px VT323, monospace";
                ctx.lineWidth = 5;
                ctx.strokeStyle = "#172c42";
                ctx.strokeText(String(personalBestScore), W - 14, 34);
                ctx.fillStyle = "#fff";
                ctx.fillText(String(personalBestScore), W - 14, 34);
                ctx.font = "bold 15px VT323, monospace";
                ctx.lineWidth = 3;
                ctx.strokeText("HIGH SCORE", W - 14, 52);
                ctx.fillText("HIGH SCORE", W - 14, 52);
                ctx.restore();
            }
            for (const item of bonusPopups) {
                const alpha = 1 - item.age / item.ttl;
                if (alpha <= 0) continue;
                ctx.save();
                ctx.globalAlpha = alpha;
                const size = item.size * (1 + (1 - alpha) * 0.2);
                if (bonusImage && bonusImage.complete && bonusImage.naturalWidth) {
                    ctx.drawImage(bonusImage, item.x - size / 2, item.y - size / 2, size, size);
                } else {
                    ctx.fillStyle = "rgba(255,255,255,.85)";
                    ctx.fillRect(item.x - size / 2, item.y - size / 2, size, size);
                    ctx.fillStyle = "#1b2a49";
                    ctx.font = "bold 24px VT323, monospace";
                    ctx.textAlign = "center";
                    ctx.fillText("+", item.x, item.y + 8);
                }
                ctx.restore();
            }
            if (state === "menu" || state === "ready") {
                const txt = state === "menu" ? "Chạm để bắt đầu chơi" : "Chạm để bắt đầu";
                ctx.globalAlpha = Math.floor(performance.now() / 500) % 2 ? 1 : 0.45;
                ctx.font = "34px VT323, monospace"; ctx.textAlign = "center";
                ctx.lineJoin = "round";
                ctx.lineWidth = 6; ctx.strokeStyle = "#1b2a49";
                ctx.strokeText(txt, W / 2, 230); ctx.fillStyle = "#fff"; ctx.fillText(txt, W / 2, 230);
                ctx.globalAlpha = 1;
            }
        }

        let last = performance.now();
        function loop(now) {
            const dt = Math.min(0.033, (now - last) / 1000); last = now;
            update(dt); draw();
            requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);

        /* ------------------------ Điều khiển ------------------------ */
        function showOverlay(over, finalScore) {
            $("overlay").classList.remove("hidden");
            $("nameRow").hidden = true;
            const showDeathMeme = over && finalScore >= 1 && finalScore <= 9;
            const showHighScoreImage = over && finalScore >= 100;
            $("gameTitle").style.display = showDeathMeme || showHighScoreImage ? "none" : "";
            $("deathMemeWrap").style.display = showDeathMeme ? "block" : "none";
            $("highScoreImage").style.display = showHighScoreImage ? "block" : "none";
            const res = $("result");
            if (over) {
                res.style.display = "block";
                $("bestScoreValue").textContent = String(personalBestScore);
                $("currentScoreValue").textContent = String(finalScore);
                $("playBtn").textContent = "PLAY";
                $("sub").style.display = "none";
            } else {
                res.style.display = "none";
            }
        }

        function beginQuickGame() {
            startBackgroundMusic();
            reset();
            state = "ready";
            $("nameRow").hidden = false;
            $("overlay").classList.add("hidden");
            flap();
        }

        let startingGame = false;
        async function startGame() {
            if (startingGame) return;
            const n = $("name").value.trim();
            if (!n) { $("name").focus(); $("name").style.outline = "3px solid #ff5a5a"; return; }
            const nameChanged = n !== playerName;
            startingGame = true;
            $("playBtn").disabled = true;
            try {
                if (nameChanged && playerName) await renamePlayerScores(playerName, n);
                if (nameChanged) {
                    localStorage.setItem("chimbay_name", n);
                }
            } catch (error) {
                console.error("Không cập nhật được BXH khi đổi tên", error);
                $("status").textContent = "Không đổi được tên trên BXH. Vui lòng thử lại.";
                return;
            } finally {
                startingGame = false;
                $("playBtn").disabled = false;
            }
            startBackgroundMusic();
            $("name").style.outline = "";
            playerName = n;
            nameEditing = false;
            syncNameEditUI();
            if (pendingScore !== null) {
                try {
                    await submitScore(n, pendingScore);
                    pendingScore = null;
                    renderBoard(n);
                } catch (error) {
                    console.error("Không gửi được điểm lên BXH", error);
                    $("status").textContent = "Không gửi được điểm lên BXH. Bấm PLAY để thử lại.";
                    return;
                }
            }
            // Đồng bộ ảnh đại diện lên Firebase để người khác thấy trên BXH
            upsertPlayer(n, birdImageData).catch(error => {
                console.error("Không gửi được ảnh đại diện", error);
                $("status").textContent = "Không gửi được ảnh đại diện lên BXH";
            });
            reset();
            state = "ready";
            $("nameRow").hidden = false;
            $("overlay").classList.add("hidden");
        }

        $("playBtn").addEventListener("click", startGame);
        $("name").addEventListener("keydown", e => { if (e.key === "Enter") startGame(); });

        const press = e => {
            if (state === "menu") {
                e.preventDefault();
                beginQuickGame();
            } else if (state === "ready" || state === "play") {
                e.preventDefault();
                flap();
            }
        };
        cv.addEventListener("pointerdown", press);
        window.addEventListener("keydown", e => {
            if (e.code === "Space" && document.activeElement !== $("name")) {
                if (state === "menu") {
                    e.preventDefault();
                    beginQuickGame();
                } else if (state === "ready" || state === "play") {
                    e.preventDefault();
                    flap();
                }
            }
        });
    </script>
</body>
